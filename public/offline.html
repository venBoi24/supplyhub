<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a3a" />
    <title>Offline · SupplyHub</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f6f9;
        color: #101a3a;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.05em;
      }
      p {
        color: #59647a;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <p>SUPPLYHUB · CONNECTION REQUIRED</p>
      <h1>You’re offline.</h1>
      <p>
        Live products, account details, checkout, and orders need an internet connection. Reconnect
        and try again.
      </p>
      <a href="/">Try the marketplace again</a>
    </main>
  </body>
</html>
