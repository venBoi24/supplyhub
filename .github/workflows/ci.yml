name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/supplyhub?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/supplyhub?schema=public"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      AUTH_SECRET: "ci-only-auth-secret-value-not-used-in-production-0123456789"
      # Build-time placeholders only. Production deploys must supply real live LynxPay credentials;
      # the app refuses to start in production without them.
      LYNXPAY_API_KEY: "lynx_live_sk_ci_build_placeholder_not_a_real_key"
      LYNXPAY_SIGNING_SECRET: "ci-build-placeholder-signing-secret"
      LYNXPAY_WEBHOOK_SECRET: "ci-build-placeholder-webhook-secret"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supplyhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e
